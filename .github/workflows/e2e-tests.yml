name: E2E Tests

on:
  push:
    branches:
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Read versions from package.json engines
        id: versions
        run: |
          node -e "const p=require('./package.json'); console.log('node=' + p.engines.node); console.log('pnpm=' + p.engines.pnpm);" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install chromium
        working-directory: tests
        run: pnpm exec playwright install chromium

      - name: Prepare services
        run: |
          docker compose -f docker-compose-dev.yml up -d --wait
          cp server/.env.sample server/.env
          sed -i 's|^BASE_URL=.*|BASE_URL=http://localhost:3000|' server/.env
          pnpm server:db:init

      - name: Start 4ga Boards and run tests
        run: pnpm ci:test:e2e
