packages:
  - 'client'
  - 'server'
  - 'tests'
  - 'packages/*'
ignoreWorkspaceRootCheck: true
allowBuilds:
  '@parcel/watcher': true
  bcrypt: true
  core-js: true
  core-js-pure: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
skills:
  dirs:
    - .claude/skills
overrides:
  js-yaml@<=4.1.1: ^5.2.0
permissions:
  '@tanstack/react-table':
    skills: true
