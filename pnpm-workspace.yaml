packages:
  - 'client'
  - 'server'
  - 'tests'
  - 'packages/*'
ignoreWorkspaceRootCheck: true
allowBuilds:
  '@parcel/watcher': true
  bcrypt: true
  core-js: true
  core-js-pure: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
skills:
  dirs:
    - .claude/skills
overrides:
  body-parser@<1.20.6: ^2.0.0
  compression@<1.8.2: ^1.8.2
  fflate@>=0.7.0 <0.7.5: ^0.8.0
  js-yaml@<=4.1.1: ^5.2.0
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  qs@>=2.2.5 <6.16.0: ^6.16.0
  serialize-javascript@<7.1.3: ^7.1.3
permissions:
  '@tanstack/react-table':
    skills: true
