      description: API client id. Use together with `X-Client-Secret`.
    clientSecret:
      type: apiKey
      in: header
      name: X-Client-Secret
      description: API client secret. Use together with `X-Client-Id`.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          examples:
            - E_NOT_FOUND
        message:
          type: string
    Entity:
      type: object
      description: Resource object returned by the API.
      additionalProperties: true
    ItemEnvelope:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/Entity'
      required:
        - item
    ItemsEnvelope:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
      required:
        - items
    ItemWithIncludedEnvelope:
      type: object
      properties:
        item: &a1
          $ref: '#/components/schemas/Entity'
        included:
          type: object
          additionalProperties:
            type: array
            items: *a1
      required:
        - item
        - included
    ItemsWithIncludedEnvelope:
      type: object
      properties:
        items:
          type: array
          items: &a1
            $ref: '#/components/schemas/Entity'
        included:
          type: object
          additionalProperties:
            type: array
            items: *a1
      required:
        - items
        - included
    StringItemEnvelope:
      type: object
      properties:
        item:
          type: string
      required:
        - item
    UserLookupEnvelope:
      type: object
      properties:
        item:
          anyOf:
            - type: object
              properties:
                id:
                  type: integer
                email:
                  type: string
                  format: email
              required:
                - id
                - email
            - type: 'null'
      required:
        - item
    LabelLookupEnvelope:
      type: object
      properties:
        item:
          type: object
          properties:
            labelId:
              type:
                - integer
                - 'null'
          required:
            - labelId
      required:
        - item
    BoardUserLookupEnvelope:
      type: object
      properties:
        item:
          type: object
          properties:
            userId:
              type:
                - integer
                - 'null'
          required:
            - userId
      required:
        - item
    MailTokenListLookupEnvelope:
      type: object
      properties:
        item:
          type: object
          properties:
            listId:
              type:
                - integer
                - 'null'
          required:
            - listId
      required:
        - item
    ExportUrlEnvelope:
      type: object
      properties:
        item:
          type: string
          format: uri
          description: URL to download the generated board export.
      required:
        - item
    SystemNotificationReceipt:
      type: object
      properties:
        success:
          type: boolean
        notificationsCreatedCount:
          type: integer
      required:
        - success
        - notificationsCreatedCount
  responses:
    BadRequest:
      description: Invalid or missing input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Access token or API client credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not enough rights
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict with the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Request could not be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
