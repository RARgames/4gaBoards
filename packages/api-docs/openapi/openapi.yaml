openapi: 3.1.0
info:
  title: 4ga Boards API
  version: beta-latest
  description: |-
    Authenticate with an access token (`Authorization: Bearer <token>`, obtained from `POST /api/access-tokens`) or with API client credentials (`X-Client-Id` and `X-Client-Secret` headers) generated in Settings/Authentication.

    Successful responses wrap data in `item` / `items` (and sometimes `included`).
  license:
    name: MIT
    url: https://github.com/RARgames/4gaBoards/blob/main/LICENSE
servers:
  - url: '{baseUrl}'
    description: Your 4ga Boards instance (set baseUrl to its address, without a trailing slash)
    variables:
      baseUrl:
        default: https://demo.4gaboards.com
tags:
  - name: access-tokens
  - name: actions
  - name: api-clients
  - name: attachments
  - name: auth
  - name: board-memberships
  - name: board-templates
  - name: boards
  - name: card-labels
  - name: card-memberships
  - name: cards
  - name: comments
  - name: core
  - name: labels
  - name: lists
  - name: mail-tokens
  - name: notifications
  - name: project-managers
  - name: project-memberships
  - name: projects
  - name: register
  - name: task-memberships
  - name: tasks
  - name: user-prefs
  - name: users
paths:
  /auth/google:
    get:
      tags:
        - auth
      summary: 'OAuth: google'
      operationId: authGoogle
      responses:
        '302':
          description: Redirect to the Google OAuth provider
      security: []
  /auth/google/callback:
    get:
      tags:
        - auth
      summary: 'OAuth: googleCallback'
      operationId: authGoogleCallback
      responses:
        '302':
          description: Callback from the Google OAuth provider
      security: []
  /auth/github:
    get:
      tags:
        - auth
      summary: 'OAuth: github'
      operationId: authGithub
      responses:
        '302':
          description: Redirect to the GitHub OAuth provider
      security: []
  /auth/github/callback:
    get:
      tags:
        - auth
      summary: 'OAuth: githubCallback'
      operationId: authGithubCallback
      responses:
        '302':
          description: Callback from the GitHub OAuth provider
      security: []
  /auth/microsoft:
    get:
      tags:
        - auth
      summary: 'OAuth: microsoft'
      operationId: authMicrosoft
      responses:
        '302':
          description: Redirect to the Microsoft OAuth provider
      security: []
  /auth/microsoft/callback:
    get:
      tags:
        - auth
      summary: 'OAuth: microsoftCallback'
      operationId: authMicrosoftCallback
      responses:
        '302':
          description: Callback from the Microsoft OAuth provider
      security: []
  /auth/oidc:
    get:
      tags:
        - auth
      summary: 'OAuth: oidc'
      operationId: authOidc
      responses:
        '302':
          description: Redirect to the OIDC OAuth provider
      security: []
  /auth/oidc/callback:
    get:
      tags:
        - auth
      summary: 'OAuth: oidcCallback'
      operationId: authOidcCallback
      responses:
        '302':
          description: Callback from the OIDC OAuth provider
      security: []
  /api/access-tokens:
    post:
      tags:
        - access-tokens
      summary: 'access tokens: create'
      operationId: accessTokensCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emailOrUsername:
                  type: string
                  minLength: 3
                  maxLength: 16
                password:
                  type: string
              required:
                - emailOrUsername
                - password
      responses:
        '200':
          description: Access token created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    type: string
                    description: Generated access token.
                required:
                  - item
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
  /api/access-tokens/me:
    delete:
      tags:
        - access-tokens
      summary: 'access tokens: delete'
      operationId: accessTokensDelete
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringItemEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/api-clients:
    get:
      tags:
        - api-clients
      summary: 'api clients: index'
      operationId: apiClientsIndex
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
    post:
      tags:
        - api-clients
      summary: 'api clients: create'
      operationId: apiClientsCreate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                permissions: {}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/api-clients/{id}:
    patch:
      tags:
        - api-clients
      summary: 'api clients: update'
      operationId: apiClientsUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                permissions: {}
                regenerateSecret:
                  type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
    delete:
      tags:
        - api-clients
      summary: 'api clients: delete'
      operationId: apiClientsDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/register:
    post:
      tags:
        - register
      summary: 'register: create'
      operationId: registerCreate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
                policy:
                  type: boolean
              required:
                - email
                - password
                - name
                - policy
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
  /api/core-settings-public:
    get:
      tags:
        - core
      summary: 'core: show'
      operationId: coreShow
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /api/core-settings:
    post:
      tags:
        - core
      summary: 'core: update'
      operationId: coreUpdate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                registrationEnabled:
                  type: boolean
                localRegistrationEnabled:
                  type: boolean
                ssoRegistrationEnabled:
                  type: boolean
                projectCreationAllEnabled:
                  type: boolean
                syncSsoDataOnAuth:
                  type: boolean
                syncSsoAdminOnAuth:
                  type: boolean
                allowedRegisterDomains: {}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/users:
    get:
      tags:
        - users
      summary: 'users: index'
      operationId: usersIndex
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
    post:
      tags:
        - users
      summary: 'users: create'
      operationId: usersCreate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
                username:
                  type:
                    - string
                    - 'null'
                  pattern: ^[a-zA-Z0-9]+((_|\.)?[a-zA-Z0-9])*$
                  minLength: 1
                  maxLength: 16
                phone:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                organization:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                ssoGoogleId:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                ssoGoogleEmail:
                  type:
                    - string
                    - 'null'
                  format: email
                ssoGithubId:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                ssoGithubUsername:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                ssoGithubEmail:
                  type:
                    - string
                    - 'null'
                  format: email
                ssoMicrosoftId:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                ssoMicrosoftEmail:
                  type:
                    - string
                    - 'null'
                  format: email
                ssoOidcId:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                ssoOidcEmail:
                  type:
                    - string
                    - 'null'
                  format: email
              required:
                - email
                - password
                - name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/users/{id}:
    get:
      tags:
        - users
      summary: 'users: show'
      operationId: usersShow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+|me$
        - name: subscribe
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
    patch:
      tags:
        - users
      summary: 'users: update'
      operationId: usersUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isAdmin:
                  type: boolean
                name:
                  type: string
                  minLength: 1
                avatarUrl: {}
                phone:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                organization:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                lastLogin: {}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
    delete:
      tags:
        - users
      summary: 'users: delete'
      operationId: usersDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/users/find-by-email:
    post:
      tags:
        - users
      summary: 'users: find by email'
      operationId: usersFindByEmail
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  minLength: 1
              required:
                - query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLookupEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/users/{id}/email:
    patch:
      tags:
        - users
      summary: 'users: update email'
      operationId: usersUpdateEmail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                currentPassword:
                  type: string
                  minLength: 1
              required:
                - email
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/users/{id}/email-verification/request:
    post:
      tags:
        - users
      summary: 'users: request email verification'
      operationId: usersRequestEmailVerification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/users/email-verification:
    post:
      tags:
        - users
      summary: 'users: update email verification'
      operationId: usersUpdateEmailVerification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                isVerified:
                  type: boolean
              required:
                - email
                - isVerified
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/users/{id}/password:
    patch:
      tags:
        - users
      summary: 'users: update password'
      operationId: usersUpdatePassword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                currentPassword:
                  type: string
                  minLength: 1
              required:
                - password
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemWithIncludedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/users/{id}/username:
    patch:
      tags:
        - users
      summary: 'users: update username'
      operationId: usersUpdateUsername
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  pattern: ^[a-zA-Z0-9]+((_|\.)?[a-zA-Z0-9])*$
                  minLength: 1
                  maxLength: 16
                currentPassword:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/users/{id}/avatar:
    post:
      tags:
        - users
      summary: 'users: update avatar'
      operationId: usersUpdateAvatar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
  /api/user-prefs/{id}:
    get:
      tags:
        - user-prefs
      summary: 'user prefs: show'
      operationId: userPrefsShow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        - clientId: []
          clientSecret: []
    patch:
      tags:
        - user-prefs
      summary: 'user prefs: update'
      operationId: userPrefsUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                subscribeToOwnCards:
                  type: boolean
                subscribeToNewBoards:
                  type: boolean
                subscribeToNewProjects:
                  type: boolean
                subscribeToUsers:
                  type: boolean
                subscribeToInstance:
                  type: boolean
                descriptionMode:
                  type: string
                  minLength: 1
                commentMode:
                  type: string
                  minLength: 1
                descriptionShown:
                  type: boolean
                tasksShown:
                  type: boolean
                attachmentsShown:
                  type: boolean
                commentsShown:
                  type: boolean
                sidebarCompact:
                  type: boolean
                defaultView:
                  type: string
                  minLength: 1
                listViewStyle:
                  type: string
                  minLength: 1
                listViewColumnVisibility: {}
                listViewFitScreen:
                  type: boolean
                listViewItemsPerPage:
                  type: string
                  minLength: 1
                usersSettingsStyle:
                  type: string
                  minLength: 1
                usersSettingsColumnVisibility: {}
                usersSettingsFitScreen:
                  type: boolean
                usersSettingsItemsPerPage:
                  type: string
                  minLength: 1
                preferredDetailsFont:
                  type: string
                  minLength: 1
                hideCardModalActivity:
                  type: boolean
                hideClosestDueDate:
                  type: boolean
                showFullDueDates:
                  type: boolean
                theme:
                  type: string
                  minLength: 1
                themeShape:
                  type: string
                  minLength: 1
                themeCustomColors: {}
                emailNotificationsEnabled:
                  type: boolean
                emailNotificationsTypes: {}
                emailNotificationsDeliveryMode:
                  type: string
                  minLength: 1
                emailNotificationsMarkReadAsDelivered:
                  type: boolean
                notificationTypes: {}
                suppressedSystemNotificationTags: {}
                selfAssignBySpacebar:
                  type: boolean
                rightClickContextMenu:
                  type: boolean
      responses:
